[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{%- macro remote_url() -%}
  https://github.com/bwks/sherpa
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}
            {% if commit.remote.pr_number %} in \
              [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})\
            {%- endif -%}
            {{ " " }}([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    # Merge commits repeat the pull request's own commits, and a revert and the commit it
    # reverts cancel out, so neither belongs in the changelog. git-cliff cannot pair a revert
    # with its commit, so a reverted commit is skipped by its id (below).
    { message = "^Merge ", skip = true },
    { message = "^Revert ", skip = true },
    # "chore: temporary version bump to test the Version check", reverted by 63ce07b.
    { sha = "04c369f6b34e480ffcdf78bdcf5f19c4464b0c3b", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { body = ".*", group = "Miscellaneous" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

# How `mise run release:bump` works out the next version (`git cliff --bumped-version`). While Sherpa is
# on 0.x, a feature bumps the patch number and a breaking change the minor number; git-cliff's
# defaults would bump the minor and major numbers instead.
[bump]
features_always_bump_minor = false
breaking_always_bump_major = false

# The repository whose pull requests and authors the changelog links. git-cliff reads the token
# for the GitHub API from GITHUB_TOKEN; dev/release-bump sets it from GH_TOKEN_RO.
[remote.github]
owner = "bwks"
repo = "sherpa"
