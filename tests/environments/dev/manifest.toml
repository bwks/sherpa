name = "sherpa-dev"
ready_timeout = 600

# One of two identical dev servers; tests/environments/agent is the other. They differ only in
# the lab and node names, the NUMA node and the CPU pins. See README.md.
[[nodes]]
name = "dev"
model = "ubuntu_linux"
version = "24.04-20260926"
memory = 32768

# NUMA node 1: vCPUs on sibling pairs 10/26 to 15/31, QEMU and disk I/O on 9/25; the host keeps
# 8/24. Memory prefers node 1 and falls back to node 0 when node 1 is full, instead of the host
# OOM killer ending the VM.
[nodes.cpu]
count = 12
mode = "host-passthrough"
topology = { sockets = 1, cores = 6, threads = 2 }
pinning = [10, 26, 11, 27, 12, 28, 13, 29, 14, 30, 15, 31]
emulator_pinning = [9, 25]

[nodes.numa]
node = 1
memory_mode = "preferred"

[nodes.boot_disk]
size = 300
clone_method = "copy"
cache = "none"
io = "native"
io_thread_cpus = [9, 25]

[nodes.interfaces]
queues = 4

[[nodes.provisioners]]
type = "ssh"
env_files = ["provision/github.env", "provision/sccache.env"]
scripts = ["provision/setup.sh"]

[[nodes.provisioners.files]]
src = "provision/mise.toml"
dst = "~/.config/mise/config.toml"
mode = 644
