# VM images seed-images.sh copies from the host's /opt/sherpa/images into a dev server and
# imports with the guest's `sherpa server image import`. Each entry is a model and a version, as
# in `sherpa server image list` in the guest, and `source`, the disk's path under
# /opt/sherpa/images on the host. The source is its own key, not derived from the model, because
# the host runs a released Sherpa whose folder names can differ from the guest's model names.
# Sources follow the host's current folder names (0.7.x, the same as the models today); when the
# host's update renames its folders, update the sources to match.
# The first version imported for a model becomes its default, so list the default first.
# Container images are not here: the host keeps them in Docker, not in /opt/sherpa/images
# (see README.md).
#
# Each [[extra_files]] entry is a file the images need that `sherpa server image import` does
# not bring: `path` under /opt/sherpa/images in the guest, and `source` under /opt/sherpa/images
# on the host. It is copied unless the guest's copy has the same SHA-256.

[[images]]
model = "alma_linux"
version = "10-20241125"
source = "alma_linux/10-20241125/virtioa.qcow2"

