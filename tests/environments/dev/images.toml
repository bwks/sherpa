# VM images seed-images.sh copies from the host's /opt/sherpa/images into a dev server and
# imports with the guest's `sherpa server image import`. Each entry is a model and a version, as
# in `sherpa server image list`; the disk is <model>/<version>/virtioa.qcow2 on the host.
# The first version imported for a model becomes its default, so list the default first.
# Container images are not here: the host keeps them in Docker, not in /opt/sherpa/images
# (see README.md).

