name = "sherpa-agent-2"
ready_timeout = 600

[[nodes]]
name = "agent-2"
model = "ubuntu_linux"
version = "24.04-20260926"
cpu_count = 8
memory = 24576
boot_disk_size = 150
boot_disk_clone_method = "copy"

# NUMA node 0: vCPUs on sibling pairs 1/17 to 4/20, QEMU and disk I/O on 0/16. Node 1 is dev's.
[nodes.performance_tuning]
cpu_mode = "host-passthrough"
cpu_topology = { sockets = 1, cores = 4, threads = 2 }
cpu_pinning = [1, 17, 2, 18, 3, 19, 4, 20]
qemu_cpus = [0, 16]
numa_node = 0
disk_cache = "none"
disk_io = "native"
disk_io_thread_cpus = [0, 16]
interface_queues = 4

# provision is a link to ../dev/provision: one copy of the provisioning for dev and the workers.
[[nodes.provisioners]]
type = "ssh"
env_files = ["provision/github.env", "provision/worker.env"]
scripts = ["provision/setup.sh"]

[[nodes.provisioners.files]]
src = "provision/mise.toml"
dst = "~/.config/mise/config.toml"
mode = 644
