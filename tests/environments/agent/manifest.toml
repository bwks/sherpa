name = "sherpa-agent-2"
ready_timeout = 600

# One of two identical dev servers; tests/environments/dev is the other. They differ only in
# the lab and node names, the NUMA node and the CPU pins. See ../dev/README.md.
[[nodes]]
name = "agent-2"
model = "ubuntu_linux"
version = "24.04-20260926"
memory = 32768

# NUMA node 0: vCPUs on sibling pairs 2/18 to 7/23, QEMU and disk I/O on 1/17; the host keeps
# 0/16. Memory prefers node 0 and falls back to node 1 when node 0 is full, instead of the host
# OOM killer ending the VM.
[nodes.cpu]
count = 12
mode = "host-passthrough"
topology = { sockets = 1, cores = 6, threads = 2 }
pinning = [2, 18, 3, 19, 4, 20, 5, 21, 6, 22, 7, 23]
emulator_pinning = [1, 17]

[nodes.numa]
node = 0
memory_mode = "preferred"

[nodes.boot_disk]
size = 300
clone_method = "copy"
cache = "none"
io = "native"
io_thread_cpus = [1, 17]

[nodes.interfaces]
queues = 4

# provision is a link to ../dev/provision: one copy of the provisioning for both dev servers.
[[nodes.provisioners]]
type = "ssh"
env_files = ["provision/github.env", "provision/sccache.env"]
scripts = ["provision/setup.sh"]

[[nodes.provisioners.files]]
src = "provision/mise.toml"
dst = "~/.config/mise/config.toml"
mode = 644
