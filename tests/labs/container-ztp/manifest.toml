name = "container-ztp"

# Each model whose config Sherpa mounts, twice: once with its image's ZTP setting (`volume`)
# and once with `ztp.method = "disabled"`, which must start it without the config, the mount and the
# logins. nats01 is an application container, whose only setting is `disabled`.
# cJunosEvolved (`juniper_evolved`, kind `container`) is left out: it boots a VM inside its
# container, which is nested and too slow in the dev servers. See README.md.

[[nodes]]
name = "ceos01"
model = "arista_eos"
kind = "container"
version = "4.35.1F"

[[nodes]]
name = "ceos02"
model = "arista_eos"
kind = "container"
version = "4.35.1F"

[nodes.ztp]
method = "disabled"

[[nodes]]
name = "srl01"
model = "nokia_srlinux"
version = "26.7.2"

[[nodes]]
name = "srl02"
model = "nokia_srlinux"
version = "26.7.2"

[nodes.ztp]
method = "disabled"

[[nodes]]
name = "frr01"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "frr02"
model = "frr_linux"
version = "10.5.2"

[nodes.ztp]
method = "disabled"

[[nodes]]
name = "nats01"
model = "nats_bus"
version = "2.11"
