name = "nixos-linux"

# Two NixOS VMs built from bwks/nixos-image, with the lab owner's account (their own name, SSH
# keys and device password), a text file and one P2p link. `{owner}` in the text file is the lab
# owner's name, filled in by the runner. The checks cover what NixOS does differently from the
# other distros: no /bin/bash, wheel instead of cloud-init sudo rules, per-user groups and eth
# interface names; the link gives each node its eth1.

[[nodes]]
name = "nix01"
model = "nixos_linux"
version = "26.05"

[[nodes.text_files]]
src = "hello.txt"
dst = "/home/{owner}/hello.txt"
user = "{owner}"
group = "{owner}"
permissions = 600

# Runs once cloud-init has finished, as the lab owner, through the SSH provisioner.
[[nodes.provisioners]]
type = "ssh"
scripts = ["provision.sh"]

[[nodes]]
name = "nix02"
model = "nixos_linux"
version = "26.05"

[[links]]
src = "nix01::eth1"
dst = "nix02::eth1"
