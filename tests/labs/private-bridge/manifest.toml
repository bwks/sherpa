name = "private-bridge"

# A VM and four containers in one private bridge. fr01, fr02 and fr03 also have links, so they
# take every data interface as a veth; fr04 has no link, so its bridge member is a Docker
# network. Both container wiring paths are covered.

[[nodes]]
name = "dev01"
model = "alpine_linux"
version = "3.23.0"
# More data interfaces than the VM uses, so redeploy has unused interfaces to leave alone.
data_interface_count = 4

[[nodes]]
name = "fr01"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "fr02"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "fr03"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "fr04"
model = "frr_linux"
version = "10.5.2"

[[links]]
src = "fr01::eth2"
dst = "fr02::eth2"

[[links]]
src = "fr03::eth2"
dst = "dev01::eth2"

[[bridges]]
name = "private"
links = ["dev01::eth1", "fr01::eth1", "fr02::eth1", "fr03::eth1", "fr04::eth1"]
