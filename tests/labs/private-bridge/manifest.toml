name = "private-bridge"

# A VM and four containers in one private bridge. Every container takes its data interfaces as
# veths; fr01, fr02 and fr03 also have links, and fr04 is on the bridge alone.

[[nodes]]
name = "dev01"
model = "alpine_linux"
version = "3.23.0"

# More data interfaces than the VM uses, so redeploy has unused interfaces to leave alone.
[nodes.interfaces]
data_count = 4

[[nodes]]
name = "fr01"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "fr02"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "fr03"
model = "frr_linux"
version = "10.5.2"

[[nodes]]
name = "fr04"
model = "frr_linux"
version = "10.5.2"

[[links]]
src = "fr01::eth2"
dst = "fr02::eth2"

[[links]]
src = "fr03::eth2"
dst = "dev01::eth2"

[[bridges]]
name = "private"
links = ["dev01::eth1", "fr01::eth1", "fr02::eth1", "fr03::eth1", "fr04::eth1"]
