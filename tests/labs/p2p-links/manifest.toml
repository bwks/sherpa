name = "p2p-links"

# Every link is P2p, and each pair of node kinds is covered: VM ⟷ VM, VM ⟷ container and
# container ⟷ container. Linux endpoints carry the raw L2, capture, impairment and jumbo
# checks. On the bundle links, Linux bonds on b1 and b2 and cEOS port-channels form LLDP
# neighbours and a two-link LACP bundle on each pair. No network-OS VM: those are nested in the
# dev servers and too slow to boot.

[[nodes]]
name = "u1"
model = "ubuntu_linux"
version = "24.04"

[nodes.interfaces]
data_count = 2

[[nodes]]
name = "u2"
model = "ubuntu_linux"
version = "24.04"

[nodes.interfaces]
data_count = 1

[[nodes]]
name = "c1"
model = "generic"
kind = "container"
image = "alpine"
version = "3.22"

[nodes.interfaces]
data_count = 2

[[nodes]]
name = "c2"
model = "generic"
kind = "container"
image = "alpine"
version = "3.22"

[[nodes]]
name = "b1"
model = "ubuntu_linux"
version = "24.04"

[nodes.interfaces]
data_count = 4

[[nodes]]
name = "b2"
model = "ubuntu_linux"
version = "24.04"

[nodes.interfaces]
data_count = 2

[[nodes]]
name = "ceos1"
model = "arista_eos"
kind = "container"
version = "4.35.1F"

[[nodes]]
name = "ceos2"
model = "arista_eos"
kind = "container"
version = "4.35.1F"

# Linux endpoints, one link per pair. The manifest impairment is applied at `up` and must
# survive down/resume and redeploys.
[[links]]
src = "u1::eth1"
dst = "u2::eth1"

[links.impairment]
delay = 5

[[links]]
src = "u1::eth2"
dst = "c1::eth1"

[[links]]
src = "c1::eth2"
dst = "c2::eth1"

# LACP bundles, two links per pair: Linux bonds on the VMs, port-channels on cEOS.
[[links]]
src = "b1::eth1"
dst = "b2::eth1"

[[links]]
src = "b1::eth2"
dst = "b2::eth2"

[[links]]
src = "b1::eth3"
dst = "ceos1::eth1"

[[links]]
src = "b1::eth4"
dst = "ceos1::eth2"

[[links]]
src = "ceos1::eth3"
dst = "ceos2::eth1"

[[links]]
src = "ceos1::eth4"
dst = "ceos2::eth2"
