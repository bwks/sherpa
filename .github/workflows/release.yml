name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-check:
    name: Check the version is not tagged yet
    runs-on: ubuntu-latest
    outputs:
      free: ${{ steps.tag.outputs.free }}
    steps:
      - name: Look for the tag on the remote
        id: tag
        run: |
          # A release of the same version that ran before this one, queued behind it in the
          # release concurrency group, has tagged it already: then there is nothing to do.
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" \
              "refs/tags/${{ inputs.version }}" > /dev/null; then
            echo "${{ inputs.version }} is already tagged; nothing to release."
            echo "free=false" >> "$GITHUB_OUTPUT"
          else
            echo "free=true" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.binary }} (${{ matrix.target }})
    needs: tag-check
    if: needs.tag-check.outputs.free == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: sherpa
            package: sherpa
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz

          - binary: sherpa
            package: sherpa
            target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          - binary: sherpa
            package: sherpa
            target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          - binary: sherpa
            package: sherpa
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

          - binary: sherpad
            package: sherpad
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Build Tailwind CSS
        if: matrix.package == 'sherpad'
        run: bash scripts/tailwind-build.sh

      - name: Build
        run: cargo build --release -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.binary }}-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}.exe" -DestinationPath "${{ matrix.binary }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [tag-check, build-app]
    if: needs.tag-check.outputs.free == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ inputs.version }} --unreleased --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        # Tag the commit that started the release, which is the one the binaries were built from;
        # main may have moved on since. The release pull request merged at that commit already
        # carries CHANGELOG.md.
        run: |
          gh auth setup-git
          git tag "${{ inputs.version }}" "$GITHUB_SHA"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body: ${{ steps.release_notes.outputs.content }}
          files: artifacts/*
