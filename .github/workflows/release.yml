name: Release

# Releases main as it is: the version in the workspace manifest, which a bump pull request set
# (`mise run release:bump`), and that version's CHANGELOG.md section as the release notes. Run it
# from the Actions tab or with `gh workflow run release.yml`. See docs/architecture/RELEASE.md.

on:
  workflow_dispatch:

permissions:
  contents: write

# Releases queue rather than overlap; the second of two runs at the same version finds the tag and
# stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release main, not ${GITHUB_REF}."
          exit 1

      # Every job checks out the commit the run started at (GITHUB_SHA), main's tip then, and
      # the release tags that commit, even if main moves on during the run.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        # The workspace version, which every crate inherits.
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sherpa") | .version')
          echo "Releasing v${version} from ${GITHUB_SHA}."
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check the version is not tagged yet
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${TAG}" > /dev/null; then
            echo "::error::${TAG} is already tagged. Bump the version first: mise run release:bump."
            exit 1
          fi

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The version's section runs from its "## [X.Y.Z] - date" heading to the next heading.
        # The notes are the section without its heading; the release is titled with the tag.
        run: |
          awk -v version="[${VERSION}]" '
            $1 == "##" { found = ($2 == version); if (found) seen = 1; next }
            found { print }
            END { exit !seen }
          ' CHANGELOG.md > notes.md || {
            echo "::error::CHANGELOG.md has no ## [${VERSION}] section. Bump the version with mise run release:bump."
            exit 1
          }
          cat notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build-app:
    name: Build ${{ matrix.binary }} (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: sherpa
            package: sherpa
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz

          - binary: sherpa
            package: sherpa
            target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          - binary: sherpa
            package: sherpa
            target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          - binary: sherpa
            package: sherpa
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

          - binary: sherpad
            package: sherpad
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz

          # Development tool, not installed by the install scripts. Its archive also holds the
          # host's start script, under the name it is installed as.
          - binary: agent-bus
            package: agent-bus
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            extra: agent-bus-start-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Build Tailwind CSS
        if: matrix.package == 'sherpad'
        run: bash scripts/tailwind-build.sh

      - name: Build
        run: cargo build --release -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Add the agent start script
        if: matrix.package == 'agent-bus'
        run: cp dev/agent-bus/start-agent.sh target/${{ matrix.target }}/release/agent-bus-start-agent

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.binary }}-${{ matrix.target }}.tar.gz ${{ matrix.binary }} ${{ matrix.extra }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}.exe" -DestinationPath "${{ matrix.binary }}-${{ matrix.target }}.zip"

      # The build- prefix lets the release job download every archive and not the notes.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [check, build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        # Tag the commit the binaries were built from; main may have moved on since. The push
        # fails if the tag appeared after the check.
        run: |
          gh auth setup-git
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          body_path: notes.md
          files: artifacts/*
