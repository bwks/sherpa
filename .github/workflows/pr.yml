name: PR

on:
  pull_request:
    branches:
      - main
  # Runs on main too, to save the build caches that PR runs restore.
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  version:
    name: Version
    # A pull request leaves the version alone, unless it is a bump pull request
    # (docs/architecture/RELEASE.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The base commit and the release tags.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The scripts' inline metadata requires Python 3.15 and no dependencies, so uv runs them on
      # their own on a uv-managed Python, without syncing the repository's uv project.
      - name: Test the version check
        run: uv run .github/scripts/test_check_version.py

      - name: Check the version
        # The checkout is the merge commit, so its first parent is the base it merges into.
        run: uv run .github/scripts/check_version.py HEAD^1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # PR runs restore the cache saved on main; only main saves, so PR branches do not
          # crowd the repository's cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check lint exceptions
        run: dev/check-lint-exceptions.sh

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The instrumented test binaries come close to filling the runner's disk; these
        # preinstalled toolchains are not used.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # PR runs restore the cache saved on main; only main saves, so PR branches do not
          # crowd the repository's cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config

      - name: Build Tailwind CSS
        run: bash scripts/tailwind-build.sh

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: Generate coverage summary
        run: cargo llvm-cov report --summary-only 2>&1 | tee coverage-summary.txt

      - name: Remove workspace coverage artifacts
        # rust-cache prunes workspace crates from target/debug but not from llvm-cov's own
        # target directory, so without this the saved cache keeps every old test binary.
        run: cargo llvm-cov clean --workspace

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
            const lines = summary.split('\n');
            const totalLine = lines.find(l => l.startsWith('TOTAL'));
            let coverageInfo = 'Coverage report generated.';
            if (totalLine) {
              const parts = totalLine.split(/\s+/).filter(Boolean);
              coverageInfo = `**Line coverage:** ${parts[3]} | **Function coverage:** ${parts[6]} | **Region coverage:** ${parts[9]}`;
            }
            const body = `## 📊 Test Coverage\n\n${coverageInfo}\n\n<details>\n<summary>Full Report</summary>\n\n\`\`\`\n${summary}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('## 📊 Test Coverage'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  windows-client:
    name: Windows Client
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # PR runs restore the cache saved on main; only main saves, so PR branches do not
          # crowd the repository's cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run client clippy
        run: cargo clippy -p sherpa -- -D warnings

      - name: Test native private key permissions
        run: cargo test -p sherpa private_key::tests
