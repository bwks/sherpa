name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    name: Check version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        # The workspace version, which every crate inherits. Only a release pull request changes
        # it, so a push that leaves it at a tagged version releases nothing.
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sherpa") | .version')
          echo "version=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git tag -l "${{ steps.version.outputs.version }}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    # Two pushes at the same version can both pass check-version before either has tagged it.
    # Releases queue rather than overlap, and release.yml checks the tag again when its turn comes.
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
