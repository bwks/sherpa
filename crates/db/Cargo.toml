[package]
name = "db"
version = "0.5.13"
edition = "2024"

[dependencies]
shared = { path = "../shared" }

# Errors
anyhow = { workspace = true }

# Networking
ipnet = { workspace = true }
jiff = { workspace = true }

# Logging
tracing = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }

# Database. Pinned exactly: Turso is pre-1.0. Default features install mimalloc as the
# process's global allocator, so they stay off.
turso = { version = "=0.8.3", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
# build.rs prepares every SQL statement in sql/queries/ against the schema in sql/schema/.
anyhow = { workspace = true }
turso = { version = "=0.8.3", default-features = false }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
