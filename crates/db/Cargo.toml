[package]
name = "db"
version.workspace = true
edition = "2024"

[dependencies]
shared = { path = "../shared" }

# Errors
anyhow = { workspace = true }

# Networking
ipnet = { workspace = true }
jiff = { workspace = true }

# Logging
tracing = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }

# Database. The workspace pins it exactly, without default features (see the root Cargo.toml).
turso = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
# build.rs prepares every SQL statement in sql/queries/ against the schema in sql/schema/.
anyhow = { workspace = true }
turso = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
