[package]
name = "db"
version = "0.5.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }

# Errors
anyhow = { workspace = true }

# Networking
ipnet = { workspace = true }
jiff = { workspace = true }

# Logging
tracing = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }

# Database. Pinned exactly: Turso is pre-1.0. Default features install mimalloc as the
# process's global allocator, so they stay off.
turso = { version = "=0.8.3", default-features = false }
# Read only by the importer that moves a pre-0.5.0 server's data out of SurrealDB.
surrealdb = "3.0.0"
surrealdb-types = "3.0.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
