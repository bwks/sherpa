[package]
name = "ebpf-redirect"
# Not versioned with Sherpa: the program is built by hand and its ELF is committed, and
# nothing reads this version. It changes only when the program does.
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya-ebpf = "0.1.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "ebpf-redirect"
path = "src/main.rs"
