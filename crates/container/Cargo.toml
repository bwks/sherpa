[package]
name = "container"
version.workspace = true
edition = "2024"

[dependencies]
shared = { path = "../shared" }
iso = { path = "../iso" }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }

bollard = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "process", "sync"] }
tokio-util = { workspace = true, features = ["codec"] }
futures-util = { workspace = true }

# MicroVMs: Cloud Hypervisor's REST API on its Unix socket, and its process
hyper = { version = "1.8.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9.1", features = ["client"] }
http-body-util = "0.1.3"
nix = { workspace = true, features = ["signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
