[package]
name = "sherpad"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "multipart"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "time"] }
time = "0.3"

shared = { path = "../shared", features = ["netinfo"] }
container = { path = "../container" }
topology = { path = "../topology" }
template = { path = "../template" }
libvirt = { path = "../libvirt" }
network = { path = "../network" }
db = { path = "../db" }
iso = { path = "../iso" }

anyhow = { workspace = true }
thiserror = { workspace = true }
jato = { workspace = true }

nix = { workspace = true, features = ["signal", "process", "user", "fs", "dir"] }

clap = { workspace = true, features = ["env"] }

ipnet = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
form_urlencoded = "1.2.2"
mime = "0.3.17"
toml = { workspace = true }

strum = { workspace = true }

zip = { version = "4", default-features = false, features = ["deflate"] }

rand = { workspace = true }

jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }

askama = { workspace = true }
askama_web = { version = "0.14.7", features = ["axum-0.8", "tracing-0.1"] }


tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
futures-util = { workspace = true }
async-stream = "0.3"

tower-http = { version = "0.6", features = ["trace"] }

rust-embed = "8"

uuid = { workspace = true, features = ["v7"] }

dashmap = "6.1"

jiff = { workspace = true }

sha2 = { workspace = true }
hex = { workspace = true }

reqwest = { workspace = true, features = ["stream", "http2", "form"] }
http-body-util = "0.1.3"

virt = { workspace = true }

bollard = { workspace = true }

ssh-key = { workspace = true }

rpassword = { workspace = true }

axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
x509-parser = { version = "0.18", features = ["verify-aws"] }
tempfile = { workspace = true }
sha-crypt = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "form", "json"] }

[lints]
workspace = true
