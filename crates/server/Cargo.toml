[package]
name = "sherpad"
version = "0.3.78"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "multipart"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "time"] }
time = "0.3"

shared = { path = "../shared", features = ["netinfo"] }
container = { path = "../container" }
topology = { path = "../topology" }
template = { path = "../template" }
libvirt = { path = "../libvirt" }
network = { path = "../network" }
validate = { path = "../validate" }
db = { path = "../db" }

# Errors
anyhow = { workspace = true }

# Process/Signal management
nix = { version = "0.30.1", features = ["signal", "process"] }

# CLI
clap = { workspace = true, features = ["env"] }

# Serialization/Deserialization
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Enum utilities
strum = { workspace = true }

# De/Compression
async-compression = { workspace = true }
zip = { version = "4", default-features = false, features = ["deflate"] }

# Random number generator
rand = { workspace = true }

# Authentication
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }

# Templates
askama = { workspace = true }


# Async / Cancellation
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
futures-util = { workspace = true }
async-stream = "0.3"

# WebSocket support
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Embed static assets
rust-embed = "8"

# UUID for connection IDs
uuid = { workspace = true, features = ["v7"] }

# Concurrent collections
dashmap = "6.1"

# Timestamps for messages
jiff = { workspace = true }

# http client
reqwest = { workspace = true, features = ["stream"] }

# Libvirt
virt = { workspace = true }

# Docker
bollard = { workspace = true }

# Regex
regex = { workspace = true }

# Generate SSH keys
ssh-key = { workspace = true }

# Password input
rpassword = { workspace = true }

# TLS support
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = "0.13"

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "form", "json"] }
