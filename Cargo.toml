[profile.dev]
incremental = true
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 and RSA run too slowly in tests at opt-level 0.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.rand]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3
[profile.dev.package.rand_chacha]
opt-level = 3
[profile.dev.package.ppv-lite86]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3

[profile.release]
opt-level = 3

# No panic = "abort": it makes dependencies build twice.
[profile.dist]
inherits = "release"
lto = true
strip = true
codegen-units = 1

[workspace]
resolver = "3"
members = [
  "crates/agent-bus",
  "crates/client",
  "crates/container",
  "crates/db",
  "crates/iso",
  "crates/network",
  "crates/libvirt",
  "crates/server",
  "crates/shared",
  "crates/template",
  "crates/topology",
]
exclude = ["crates/ebpf-redirect"]
default-members = ["crates/client"]

[workspace.package]
version = "0.9.4"

[workspace.dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.100"
askama = "0.14.0"
async-nats = { version = "0.52.0", default-features = false }
base64 = "0.22.1"
bollard = "0.19.3"
clap = { version = "4.5.16", features = ["derive"] }
dirs = "6.0"
futures = "0.3.31"
futures-util = "0.3.31"
ipnet = "2.11.0"
jiff = { version = "0.2.20", features = ["serde"] }
nix = "0.30.1"
nkeys = "0.4.5"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.8.5"
rpassword = "7.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.128"
sha-crypt = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
sha2 = "0.10.8"
ssh-key = { version = "0.6.7", features = ["rsa", "ed25519"] }
strum = "0.27"
tempfile = "3.25.0"
gethostname = "1.1.0"
hex = "0.4"
thiserror = "2.0.17"
tokio = "1.49.0"
tokio-tungstenite = "0.28"
tokio-util = "0.7"
toml = "0.8.19"
tracing = "0.1"
tracing-subscriber = "0.3"
# Default features install mimalloc as the global allocator.
turso = { version = "=0.8.3", default-features = false }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
virt = { version = "0.4.1", features = ["qemu"] }

jato = { git = "https://github.com/bwks/jato-lib", tag = "v0.6.0", features = ["terminal"] }

reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.32"

[workspace.lints.rust]
# Deny, not forbid: clap's derives emit `#[allow(dead_code)]`.
dead_code = "deny"

# unwrap_used and expect_used are denied in each crate root, not here, so tests can use them.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
absolute_paths = "warn"
