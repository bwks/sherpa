# Keep development builds incremental and avoid broad debug optimization for fast local iteration.
[profile.dev]
incremental = true
opt-level = 0

# Speed up SSH key generation in debug mode without optimizing all dependencies.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# Keep default release builds fast for local development and CI validation.
# Cargo's default release profile already uses opt-level 3; keep that explicit
# here and reserve expensive LTO/codegen settings for distribution artifacts.
[profile.release]
opt-level = 3

# Explicit distribution profile for small, heavily optimized binaries.
# Do not set panic = "abort" here: workspace/all-target release builds then
# compile many dependencies twice (abort + unwind), which is slower overall.
[profile.dist]
inherits = "release"
lto = true
strip = true
codegen-units = 1

[workspace]
resolver = "3"
members = [
  "crates/client",
  "crates/container",
  "crates/db",
  "crates/network",
  "crates/libvirt",
  "crates/server",
  "crates/shared",
  "crates/template",
  "crates/topology",
  "crates/validate",
]
exclude = ["crates/ebpf-redirect"]
default-members = ["crates/client"]

[workspace.dependencies]
# Common application dependencies
anyhow = "1.0.100"
askama = "0.14.0"
async-compression = { version = "0.4.32", features = ["tokio", "gzip"] }
base64 = "0.22.1"
bollard = "0.19.3"
clap = { version = "4.5.16", features = ["derive"] }
dirs = "6.0"
futures = "0.3.31"
futures-util = "0.3.31"
ipnet = "2.11.0"
jiff = { version = "0.2.20", features = ["serde"] }
rand = "0.8.5"
regex = "1"
rpassword = "7.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.128"
ssh-key = { version = "0.6.7", features = ["rsa", "ed25519"] }
strum = "0.27"
tempfile = "3.25.0"
tokio = "1.49.0"
tokio-tungstenite = "0.28"
tokio-util = "0.7"
toml = "0.8.19"
toml_edit = "0.22.22"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
virt = { version = "0.4.1", features = ["qemu"] }

# HTTP client
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

# OpenTelemetry
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.32"

[workspace.lints.rust]
dead_code = "forbid"

# Clippy lints: unwrap_used and expect_used are denied via
# #![deny(...)] in each crate's lib.rs/main.rs (not here),
# because workspace-level deny translates to --deny CLI flags
# which cannot be overridden by #[allow] in test code.
# See clippy.toml for test exceptions.
