# Python for Sherpa's test harness, lab tests and development helpers. uv installs the
# interpreter and the dependencies; the scripts are not a package.
[project]
name = "sherpa-dev"
version = "0.0.0"
description = "Python tooling for developing and testing Sherpa"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
# Use only Python that uv installs, never the system's.
python-preference = "only-managed"
