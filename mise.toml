# Tools for working on Sherpa, installed with `mise install`. System libraries and the C
# toolchain, such as libvirt-dev, pkg-config and clang, come from the OS package manager.

[settings]
# Rust follows the repository's rust-toolchain.toml files, which name the channel and its
# components: stable at the root, nightly for the eBPF program in crates/ebpf-redirect.
idiomatic_version_file_enable_tools = ["rust"]
# Python comes from uv, as pyproject.toml sets it up: in the project, mise creates the uv
# virtual environment and puts it on the PATH.
python.uv_venv_auto = "create|source"

[tools]
# Installs Python and its dependencies for pyproject.toml; use it for all Python work.
uv = "latest"
# Links the eBPF program. 0.12 links a system LLVM of a version Ubuntu 24.04 does not ship.
"cargo:bpf-linker" = "0.10.2"
# Runs the workspace's tests, a process per test, for `cargo nextest run --workspace`. CI uses
# it through `cargo llvm-cov nextest`.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
# Runs the install and update script tests in tests/bats.
bats = "latest"
# Writes CHANGELOG.md and works out the next version, for `mise run release:bump`.
git-cliff = "2.14.2"

[tasks."release:bump"]
description = "Set the next version, update Cargo.lock and regenerate CHANGELOG.md, without committing"
usage = 'arg "[version]" help="The version, X.Y.Z. Default: worked out by git-cliff from the commits since the last tag."'
run = 'dev/release-bump ${usage_version:+"$usage_version"}'
